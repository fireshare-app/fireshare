user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

thread_pool default threads=64 max_queue=131072;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$http_x_forwarded_for - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$remote_addr"';

    server_tokens off;
    access_log  off;

    sendfile        on;
    sendfile_max_chunk 2m;
    tcp_nopush     on;
    tcp_nodelay    on;
    
    keepalive_timeout  65;
    keepalive_requests 100;
    
    client_body_buffer_size 256k;
    client_body_timeout 60s;

    proxy_cache_path /var/cache/nginx 
                     keys_zone=PROXYCACHE:200m
                     inactive=120m
                     max_size=2g
                     levels=1:2;

    # The answer to "may this viewer have this video" is kept for a few seconds. A
    # browser fetches a video in many byte ranges, and each range used to be a
    # round trip to the API before the first byte could go out; while a scan or a
    # transcode had the API busy, that round trip was most of the lag on a seek or
    # a quality switch. Keyed by the video and the viewer's cookies, so a password
    # unlock or a logout is a different entry.
    proxy_cache_path /var/cache/nginx/auth
                     keys_zone=AUTHCACHE:1m
                     inactive=1m
                     max_size=16m
                     levels=1:2;

    # Kept-open connections for the auth subrequests, instead of a new TCP
    # connection to gunicorn for every byte range. Shorter than gunicorn's own
    # 5 second keepalive, so nginx never reuses a connection gunicorn is closing.
    upstream fireshare_auth {
        server 127.0.0.1:5000;
        keepalive 16;
        keepalive_timeout 4s;
    }
    
    proxy_cache_key  "$scheme$request_method$host$request_uri";
    add_header X-Cache-Status $upstream_cache_status;
    proxy_cache_min_uses 1;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;

    server {
        listen __FIRESHARE_PORT__ default_server reuseport;
        server_name _;
        
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied    any;
        gzip_comp_level 5;
        gzip_types
            application/atom+xml
            application/javascript
            application/json
            application/manifest+json
            application/x-font-ttf
            application/xml
            font/opentype
            image/svg+xml
            text/cache-manifest
            text/css
            text/plain
            text/xml;

        root /processed/;
        aio threads=default;

        # No open_file_cache: crops, transcodes and posters are rewritten in place under
        # the same names, and the cache kept serving what it last saw for up to two
        # minutes. A crop looked up before it existed stayed "not found" after it was
        # made, so the player got a 404, and a re-crop kept serving the old file.

        location /_content/ {
            rewrite ^/_content/(.*)$ /$1 break;
            proxy_cache        PROXYCACHE;
            proxy_cache_valid 200 302 30m;
            proxy_cache_valid 404      5m;
            add_header Cache-Control "public, max-age=1800";
            root /processed/;
        }

        location = /internal/video-auth {
            internal;
            proxy_pass              http://fireshare_auth/api/video/nginx-auth;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_cache             AUTHCACHE;
            proxy_cache_key         "$video_id|$http_cookie";
            proxy_cache_valid       200 403 15s;
            proxy_cache_use_stale   off;
            proxy_cache_background_update off;
            proxy_ignore_headers    Cache-Control Expires Set-Cookie Vary;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
            # The id captured by the serving location, so the auth check gates the same
            # video the try_files below actually serves. Declaring it here also stops a
            # client-supplied header of this name from being forwarded.
            proxy_set_header        X-Fireshare-Video-Id $video_id;
            proxy_set_header        Cookie $http_cookie;
        }

        location = /internal/video-auth-admin {
            internal;
            proxy_pass              http://fireshare_auth/api/video/nginx-auth-admin;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_cache             AUTHCACHE;
            proxy_cache_key         "admin|$video_id|$http_cookie";
            proxy_cache_valid       200 403 15s;
            proxy_cache_use_stale   off;
            proxy_cache_background_update off;
            proxy_ignore_headers    Cache-Control Expires Set-Cookie Vary;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
            # The raw-video gate resolves the id so it can honour per-video edit
            # permission. $video_id is set by the serving location during the rewrite
            # phase, which runs before this access-phase subrequest. Declaring the
            # header here also stops a client-supplied one from being forwarded.
            proxy_set_header        X-Fireshare-Video-Id $video_id;
            proxy_set_header        Cookie $http_cookie;
        }

        location ~ ^/_content/derived/([^/]+)/thumbnail$ {
            set $video_id $1;
            root /processed/;
            add_header Cache-Control "no-cache, must-revalidate";
            try_files /derived/$video_id/custom_poster.webp /derived/$video_id/poster.jpg =404;
        }

        # The crop and the transcodes keep their names when a video is re-cropped, so the
        # browser has to check they are still the same file rather than keep them for a
        # year. The player also adds ?v= to them, which moves it off anything it cached.
        location ~ ^/_content/derived/([^/]+)/[^/]+\.mp4$ {
            set $video_id $1;
            auth_request /internal/video-auth;
            rewrite ^/_content/(.*)$ /$1 break;
            root /processed/;
            add_header Cache-Control "no-cache";
        }

        # The video id is the first path segment under /derived/. Capturing it here gives
        # the auth subrequest the same id this location serves from, and initialises
        # $video_id for it: without the capture every derived asset logged an
        # "uninitialized video_id" warning and the gate had to re-parse the URI.
        location ~ ^/_content/derived/([^/]+) {
            set $video_id $1;
            auth_request /internal/video-auth;
            rewrite ^/_content/(.*)$ /$1 break;
            root /processed/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~ ^/_content/video/([\w-]+)(\.[^/]+)$ {
            # Captured before auth_request runs so the gate sees the same id as try_files
            set $video_id $1;
            set $video_ext $2;

            auth_request /internal/video-auth;

            # Served the same way as the transcodes: sendfile out of the page cache,
            # through the thread pool. The directio that was here read every byte
            # from disk again, so a seek or a quality switch back to the source never
            # found anything cached in memory.
            mp4;
            mp4_buffer_size 2m;
            mp4_max_buffer_size 50m;

            # Revalidated rather than immutable: this URL serves the crop when there is
            # one and the original when there is not, so its content changes with the crop.
            add_header Cache-Control "no-cache";
            add_header Accept-Ranges bytes;

            root /processed/;
            try_files /derived/$video_id/$video_id-cropped.mp4 /video_links/$video_id$video_ext =404;
        }

        location ~ ^/_content/video-raw/([\w-]+)(\.[^/]+)$ {
            auth_request /internal/video-auth-admin;

            mp4;
            mp4_buffer_size 2m;
            mp4_max_buffer_size 50m;

            add_header Cache-Control "no-store";
            add_header Accept-Ranges bytes;

            set $video_id $1;
            set $video_ext $2;
            root /processed/;
            try_files /video_links/$video_id$video_ext =404;
        }

        location /_content/image/ {
            sendfile off;
            add_header Cache-Control "public, max-age=86400";
            rewrite ^/_content/image/(.*)$ /$1 break;
            root /processed/image_links/;
        }

        location ~ ^/_content/game_assets/(.*)$ {
            alias /data/game_assets/$1;
            add_header Cache-Control "public, max-age=86400";
            error_page 404 = @game_asset_fallback;
        }

        location @game_asset_fallback {
            rewrite ^/_content/game_assets/(.*)$ /api/game/assets/$1 break;
            proxy_pass              http://127.0.0.1:5000;
            proxy_http_version      1.1;

            proxy_set_header        Connection "";
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        Host $http_host;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_buffering         off;
        }

        location ~ "^/error/([0-9]+)$" {
            internal;
            set $error_code $1;
            ssi on;
            root /etc/nginx;
            rewrite ^ /error.html break;
        }

        location = /api-unavailable {
            internal;
            root /etc/nginx;
            rewrite ^ /api_unavailable.html break;
        }

        error_page 400 /error/400;
        error_page 401 /error/401;
        error_page 403 /error/403;
        error_page 404 /error/404;
        error_page 405 /error/405;
        error_page 408 /error/408;
        error_page 410 /error/410;
        error_page 413 /error/413;
        error_page 414 /error/414;
        error_page 429 /error/429;
        error_page 500 /error/500;
        error_page 502 /api-unavailable;
        error_page 503 /api-unavailable;
        error_page 504 /api-unavailable;

        location / {
            proxy_cache        PROXYCACHE;
            proxy_cache_valid 200 302 60m;
            proxy_cache_valid 404      5m;
            add_header Cache-Control "public, max-age=3600";
            root /app/build;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # SSE endpoint — must disable buffering/caching so events stream immediately
        location = /api/admin/stream {
            proxy_pass              http://127.0.0.1:5000;
            proxy_http_version      1.1;

            proxy_set_header        Connection "";
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        Host $http_host;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_buffering         off;
            proxy_cache             off;
            proxy_read_timeout      86400s;

            add_header              Cache-Control "no-cache";
            add_header              X-Accel-Buffering "no";
        }

        location = /api/uploadChunked {
            proxy_pass              http://127.0.0.1:5000;
            proxy_http_version      1.1;

            proxy_set_header        Connection "";
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        Host $http_host;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_request_buffering off;
            client_max_body_size    0;

            proxy_connect_timeout   60s;
            proxy_send_timeout      120s;
            proxy_read_timeout      999999s;
        }

        location ~ /api/.*$ {
            proxy_pass              http://127.0.0.1:5000;
            proxy_http_version      1.1;

            proxy_set_header        Connection "";
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        Host $http_host;
            proxy_set_header        X-Forwarded-Proto $scheme;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            proxy_connect_timeout   60s;
            proxy_send_timeout      120s;
            proxy_read_timeout      999999s;
            client_max_body_size 0;
        }

        location ~ /w/.*$ {
            proxy_pass              http://127.0.0.1:5000;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        Host $http_host;
            proxy_connect_timeout   60s;
            proxy_read_timeout      60s;
        }

        location ~ /i/.*$ {
            proxy_pass              http://127.0.0.1:5000;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        Host $http_host;
            proxy_connect_timeout   60s;
            proxy_read_timeout      60s;
        }

        # Profile share links: Flask renders the Open Graph metadata, same as /w/ and /i/.
        location ~ /u/.*$ {
            proxy_pass              http://127.0.0.1:5000;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        Host $http_host;
            proxy_connect_timeout   60s;
            proxy_read_timeout      60s;
        }
    }
}
